name: Build and Publish

on:
  schedule:
    - cron: '20 0 * * *'
      timezone: 'Asia/Jakarta'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - name: Get upstream docling-serve version and format tag
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_VERSION=$(curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/docling-project/docling-serve/releases/latest | jq -r '.tag_name')

          if [ -z "$UPSTREAM_VERSION" ] || [ "$UPSTREAM_VERSION" = "null" ]; then
            echo "::error::Failed to fetch a valid upstream version. The API returned: $UPSTREAM_VERSION"
            echo "::error::This is likely due to an API rate limit or missing upstream tags."
            exit 1
          fi

          FORMATTED_TAG="ds-$UPSTREAM_VERSION"

          echo "Detected valid upstream version: $UPSTREAM_VERSION"
          echo "tag=$FORMATTED_TAG" >> $GITHUB_OUTPUT

      - name: Check if tag exists in GHCR or force build on code push
        id: check_ghcr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PACKAGE_NAME=$(basename ${{ github.repository }})
          TARGET_TAG="${{ steps.upstream.outputs.tag }}"
          
          # Force build on direct repository changes (push/workflow_dispatch) regardless of GHCR tag existence
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Event '$EVENT_NAME' detected. Forcing build to incorporate local code/Dockerfile changes."
            echo "build_needed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Query GHCR for scheduled cron runs
          TAG_EXISTS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            /users/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions \
            --jq ".[] | select(.metadata.container.tags[]? == \"$TARGET_TAG\") | .id" || echo "")
          
          if [ -n "$TAG_EXISTS" ]; then
            echo "Tag $TARGET_TAG already exists in GHCR. Skipping scheduled build."
            echo "build_needed=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream version detected ($TARGET_TAG). Proceeding with scheduled build."
            echo "build_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check_ghcr.outputs.build_needed == 'true'
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        if: steps.check_ghcr.outputs.build_needed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check_ghcr.outputs.build_needed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and Dual-Tag
        if: steps.check_ghcr.outputs.build_needed == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream.outputs.tag }}

      - name: Build and push Docker image
        if: steps.check_ghcr.outputs.build_needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Update README Badge
        if: steps.check_ghcr.outputs.build_needed == 'true'
        run: |
          SIZE_BYTES=$(docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest | jq '[.layers[].size] | add')
          SIZE_GB=$(echo "$SIZE_BYTES" | awk '{print int(($1 / 1024 / 1024 / 1024) + 0.5)"GB"}')

          echo "Calculated GHCR image size: $SIZE_GB"

          sed -i "s|\[github-ghcr-size-shield\]: .*|\[github-ghcr-size-shield\]: https://img.shields.io/badge/GHCR%20Size-${SIZE_GB}-blue|g" README.md

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md

          if ! git diff --staged --quiet; then
            git commit -m "docs: update GHCR image size badge to ${SIZE_GB}"
            git push
          else
            echo "No badge changes needed in README.md"
          fi
