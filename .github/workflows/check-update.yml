name: Check for docling-serve Updates

on:
  schedule:
    - cron: '10 0 * * *'
      timezone: 'Asia/Jakarta'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Check latest docling-serve release
        id: check
        run: |
          # docling-serve releases endpoint
          LATEST_VERSION=$(curl -s https://api.github.com/repos/docling-project/docling-serve/releases/latest | jq -r .tag_name)
          CURRENT_VERSION=$(cat docling-serve_version.txt)
          
          if [ "$LATEST_VERSION" != "null" ] && [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "New version detected: $LATEST_VERSION"
            echo "$LATEST_VERSION" > docling-serve_version.txt
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add docling-serve_version.txt
            git commit -m "chore: bump docling-serve version to $LATEST_VERSION"
            git push
          else
            echo "No new version detected. Current: $CURRENT_VERSION"
          fi
